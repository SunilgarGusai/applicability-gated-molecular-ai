name: Validate frozen package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Frozen aggregate integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.3 PyYAML==6.0.2

      - name: Validate frozen public package
        run: python scripts/validate_frozen_package.py
