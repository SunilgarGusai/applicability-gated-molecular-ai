project: applicability_gated_rule_residual
primary_datasets: [ESOL, BBBP]
sensitivity_datasets: [FreeSolv, Lipophilicity]
external_dataset: B3DB_external
seeds: [20260711, 20260719, 20260727, 20260804, 20260812]
splits:
  random: {train: 0.70, validation: 0.15, test: 0.15}
  scaffold: {train: 0.70, validation: 0.15, test: 0.15}
  butina: {train: 0.70, validation: 0.15, test: 0.15, distance_cutoff: 0.60}
features:
  descriptors: 20
  morgan_bits: 1024
  morgan_radius: 2
model:
  graph_layers: 2
  hidden_width: 48
  dropout: 0.10
  learning_rate: 0.002
  weight_decay: 0.00001
  batch_size: 64
  max_epochs: 70
  patience: 12
  ensemble_members: 3
  gate_lambda: 0.002
uncertainty:
  regression: ensemble_plus_validation_noise_floor
  classification: ensemble_temperature_scaling
