<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Applicability-Gated Molecular AI</title>
  <desc id="desc">A visual banner for the reproducibility repository showing molecular AI, explicit scientific rules, applicability and uncertainty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="0.55" stop-color="#123b5d"/>
      <stop offset="1" stop-color="#0c6b73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#6fd3ff"/>
      <stop offset="1" stop-color="#7cf2c6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <circle cx="1020" cy="58" r="125" fill="#39d2c0" opacity="0.11" filter="url(#soft)"/>
  <circle cx="1120" cy="235" r="145" fill="#58a6ff" opacity="0.10" filter="url(#soft)"/>
  <g opacity="0.62" stroke="url(#accent)" stroke-width="4" fill="none">
    <circle cx="965" cy="118" r="18"/>
    <circle cx="1032" cy="84" r="15"/>
    <circle cx="1098" cy="123" r="19"/>
    <circle cx="1023" cy="171" r="17"/>
    <circle cx="1110" cy="198" r="14"/>
    <line x1="981" y1="109" x2="1018" y2="92"/>
    <line x1="1046" y1="92" x2="1082" y2="114"/>
    <line x1="1091" y1="140" x2="1040" y2="164"/>
    <line x1="1038" y1="175" x2="1096" y2="194"/>
    <line x1="978" y1="132" x2="1010" y2="160"/>
  </g>
  <g transform="translate(72 58)">
    <text x="0" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff">Applicability-Gated Molecular AI</text>
    <text x="0" y="88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#cfe8f7">Trustworthy, knowledge-guided prediction under chemical-space shift</text>
    <rect x="0" y="119" width="655" height="2" fill="url(#accent)" opacity="0.9"/>
    <text x="0" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#d7edf5">explicit scientific rule  •  applicability  •  learned reliance</text>
    <text x="0" y="188" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#d7edf5">uncertainty  •  rule-failure diagnosis  •  external transfer</text>
  </g>
</svg>
