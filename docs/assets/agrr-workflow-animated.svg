<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc">
<title id="title">Applicability-Gated Rule-Residual Learning workflow</title>
<desc id="desc">High-contrast AGRR workflow showing the predictive path, rule reliance, uncertainty, and a separate rule-failure audit path.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="970" rx="28" fill="#0b1220"/>
<rect x="28" y="28" width="1544" height="914" rx="24" fill="none" stroke="#243244" stroke-width="2"/>
<text x="70" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f8fafc">Applicability-Gated Rule-Residual Learning (AGRR)</text>
<text x="70" y="111" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#cbd5e1">Prediction path and independent rule-failure audit • fixed high-contrast palette for light and dark GitHub themes</text>
<line x1="70" y1="136" x2="1530" y2="136" stroke="#243244" stroke-width="2"/>
<text x="80" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#7dd3fc">PREDICTIVE PATH</text>
<text x="80" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#d8b4fe">AUDIT PATH — DOES NOT FEED BACK INTO THE PREDICTION</text>
<path d="M 250 415.0 L 310 400.0" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 250 385 C 360 170, 520 150, 700 150" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 610 400.0 L 700 340.0" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 610 410 C 640 430, 640 500, 680 520" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 610 430 C 650 560, 640 665, 680 675" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1000 520 C 1020 520, 1020 560, 1060 570" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 675 C 1010 675, 1025 620, 1060 605" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1000 150 C 1080 150, 1100 260, 1170 280" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1000 340 L 1110 335" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1215 525 C 1260 500, 1260 430, 1265 400" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1410 320 C 1430 300, 1430 270, 1440 270" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1410 365 C 1440 395, 1405 430, 1420 445" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 460 465 C 470 590, 500 720, 630 800" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 930 845 L 1050 840" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="60" y="365" width="190" height="100" rx="18" fill="#172033" stroke="#94a3b8" stroke-width="2.8"/><text x="155.0" y="423.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#f8fafc">Molecule x</text><rect x="310" y="335" width="300" height="130" rx="18" fill="#172033" stroke="#60a5fa" stroke-width="2.8"/><text x="460.0" y="392.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Graph + molecular</text><text x="460.0" y="423.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">descriptors</text><rect x="700" y="95" width="300" height="110" rx="18" fill="#2a1d16" stroke="#fb923c" stroke-width="2.8"/><text x="850.0" y="142.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Explicit scientific</text><text x="850.0" y="173.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">rule r(x)</text><rect x="700" y="285" width="300" height="110" rx="18" fill="#172033" stroke="#94a3b8" stroke-width="2.8"/><text x="850.0" y="332.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Neural molecular</text><text x="850.0" y="363.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">expert nθ(x)</text><rect x="680" y="465" width="320" height="110" rx="18" fill="#10243d" stroke="#38bdf8" stroke-width="2.8"/><text x="840.0" y="512.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Empirical applicability</text><text x="840.0" y="543.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">a(x)</text><rect x="680" y="620" width="300" height="110" rx="18" fill="#24163a" stroke="#c084fc" stroke-width="2.8"/><text x="830.0" y="667.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Learned trust</text><text x="830.0" y="698.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">t(x)</text><rect x="1060" y="525" width="310" height="120" rx="18" fill="#10243d" stroke="#38bdf8" stroke-width="2.8"/><text x="1215.0" y="577.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Rule reliance</text><text x="1215.0" y="608.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#f8fafc">ρ(x) = a(x) × t(x)</text><rect x="1110" y="280" width="300" height="120" rx="18" fill="#102b24" stroke="#34d399" stroke-width="2.8"/><text x="1260.0" y="332.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Rule-aware mixture</text><text x="1260.0" y="363.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#f8fafc">ŷ = (1 − ρ)nθ + ρr</text><rect x="1440" y="220" width="130" height="100" rx="18" fill="#172033" stroke="#94a3b8" stroke-width="2.8"/><text x="1505.0" y="262.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Final</text><text x="1505.0" y="293.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">prediction</text><rect x="1420" y="390" width="160" height="110" rx="18" fill="#172033" stroke="#94a3b8" stroke-width="2.8"/><text x="1500.0" y="437.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Ensemble</text><text x="1500.0" y="468.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">uncertainty</text><rect x="590" y="800" width="340" height="90" rx="18" fill="#24163a" stroke="#c084fc" stroke-width="2.8"/><text x="760.0" y="853.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#f8fafc">Independent rule-failure model</text><rect x="1050" y="790" width="330" height="100" rx="18" fill="#172033" stroke="#94a3b8" stroke-width="2.8"/><text x="1215.0" y="832.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Failure score /</text><text x="1215.0" y="863.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">selective rule audit</text><text x="80" y="930" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">Rule reliance is explicit: ρ(x) = a(x) × t(x). The failure model supports retrospective diagnosis and selective analysis only.</text>
<defs><filter id="pulseGlow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path id="learnedPath" d="M 155 415 C 260 415, 300 400, 460 400 S 720 340, 850 340 S 1120 335, 1260 340 S 1430 270, 1500 270" fill="none" stroke="none"/><path id="rulePath" d="M 155 415 C 330 190, 520 150, 850 150 S 1110 250, 1260 340" fill="none" stroke="none"/><path id="auditPath" d="M 460 430 C 470 600, 520 760, 760 845 S 1080 840, 1215 840" fill="none" stroke="none"/>
<circle r="9" fill="#34d399" opacity="0" filter="url(#pulseGlow)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="7s" repeatCount="indefinite"/><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#learnedPath"/></animateMotion></circle>
<circle r="8" fill="#fb923c" opacity="0" filter="url(#pulseGlow)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.2;0.82;1" dur="7s" repeatCount="indefinite"/><animateMotion dur="7s" begin="0.8s" repeatCount="indefinite"><mpath href="#rulePath"/></animateMotion></circle>
<circle r="8" fill="#c084fc" opacity="0" filter="url(#pulseGlow)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.28;0.88;1" dur="7s" repeatCount="indefinite"/><animateMotion dur="7s" begin="1.6s" repeatCount="indefinite"><mpath href="#auditPath"/></animateMotion></circle>
</svg>